[project]
name = "human-hand-to-robot"
version = "0.1.0"
description = "Human hand demonstrations retargeted to SO-ARM101 manipulation in Isaac Lab"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "isaaclab[isaacsim,all]==2.3.2.post1",

    "torch==2.7.0",
    "torchvision==0.22.0",

    "numpy",
    "scipy",
    "opencv-python",
    "matplotlib",

    "datasets",
    "huggingface-hub",
    "jsonlines",
]

[project.scripts]
inspect-demo = "human_data.scripts.inspect_demo:main"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.8.21,<0.9.0"]
build-backend = "uv_build"